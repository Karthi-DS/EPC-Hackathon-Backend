name: Deploy to Render

on:
  push:
    branches:
      - main
      - Course-main
      - Enrollment-main
      - Student-main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.RENDER_STUDENT_DEPLOY_HOOK }}" ]; then
            echo "Missing Render deploy hook secret: RENDER_DEPLOY_HOOK"
            exit 1
          fi
          curl -X POST -H "Accept: application/json" "${{ secrets.RENDER_COURSE_STUDENT_HOOK }}"
        shell: bash